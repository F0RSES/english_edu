name: english_edu
description: Offline-first English learning app
publish_to: none
version: 1.16.0+16

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.0
  flutter_local_notifications: ^22.3.3
  flutter_riverpod: ^3.4.3
  flutter_timezone: ^5.1.1
  go_router: ^18.1.3
  google_fonts: ^6.2.1
  http: ^1.2.0
  meta: ^1.19.0
  path: ^1.9.1
  sentry_flutter: ^10.3.0
  smooth_page_indicator: ^1.1.0
  stts: ^1.3.4
  supabase_flutter: ^2.5.0
  timezone: ^0.11.2

dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.35.2
  flutter_launcher_icons: ^0.14.0
  flutter_native_splash: ^2.4.0
  flutter_test:
    sdk: flutter
  test: ^1.31.1
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/google_fonts/
    # Только слитый словарь: words_v1/words_<level>.json — входные файлы
    # tools/merge_seeds.dart, в APK им делать нечего (~1 МБ).
    - assets/seed/words_v2.json
    - assets/seed/phrases_v1.json
    - assets/seed/stories_v1.json
